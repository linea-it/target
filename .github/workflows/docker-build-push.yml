name: Docker build & push

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Image to build and push'
        type: choice
        required: true
        default: all
        options:
          - all
          - backend
          - frontend
          - mydb_frontend

env:
  IMAGE_REPO: linea/target

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          # git describe needs the full history and tags
          fetch-depth: 0

      - name: Compute tag
        id: vars
        run: echo "tag=$(git describe --always)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        id: backend
        if: inputs.image == 'all' || inputs.image == 'backend'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: compose/production/django/Dockerfile
          push: true
          tags: ${{ env.IMAGE_REPO }}:backend_${{ steps.vars.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        id: frontend
        if: inputs.image == 'all' || inputs.image == 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: compose/production/frontend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_REPO }}:frontend_${{ steps.vars.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push mydb_frontend
        id: mydb_frontend
        if: inputs.image == 'all' || inputs.image == 'mydb_frontend'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mydb/compose/production/frontend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_REPO }}:mydb_frontend_${{ steps.vars.outputs.tag }}
          cache-from: type=gha,scope=mydb_frontend
          cache-to: type=gha,mode=max,scope=mydb_frontend

      - name: Summary
        if: always()
        env:
          SELECTION: ${{ inputs.image }}
          TAG: ${{ steps.vars.outputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          BACKEND_OUTCOME: ${{ steps.backend.outcome }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_OUTCOME: ${{ steps.frontend.outcome }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          MYDB_FRONTEND_OUTCOME: ${{ steps.mydb_frontend.outcome }}
          MYDB_FRONTEND_DIGEST: ${{ steps.mydb_frontend.outputs.digest }}
        run: |
          pushed=()
          rows=""
          add_row() {
            local name="$1" outcome="$2" digest="$3"
            local image="${IMAGE_REPO}:${name}_${TAG}"
            case "$outcome" in
              success) icon="✅ pushed"; pushed+=("$image") ;;
              failure) icon="❌ failed" ;;
              cancelled) icon="⚠️ cancelled" ;;
              *) return ;;  # skipped / not selected
            esac
            rows+="| ${name} | **\`${image}\`** | ${icon} | \`${digest:--}\` |"$'\n'
          }
          add_row backend "$BACKEND_OUTCOME" "$BACKEND_DIGEST"
          add_row frontend "$FRONTEND_OUTCOME" "$FRONTEND_DIGEST"
          add_row mydb_frontend "$MYDB_FRONTEND_OUTCOME" "$MYDB_FRONTEND_DIGEST"

          {
            echo "## 🐳 Docker images pushed"
            echo
            echo "**Selection:** \`${SELECTION}\` · **Branch:** \`${REF_NAME}\` · **Commit:** \`${SHA:0:7}\` · **Tag suffix:** \`${TAG}\`"
            echo
            if [ -n "$rows" ]; then
              echo "| Image | Name | Status | Digest |"
              echo "|---|---|---|---|"
              printf '%s' "$rows"
            else
              echo "_No image was built._"
            fi
            if [ ${#pushed[@]} -gt 0 ]; then
              echo
              echo "### Pushed images"
              echo
              echo '```text'
              printf '%s\n' "${pushed[@]}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
