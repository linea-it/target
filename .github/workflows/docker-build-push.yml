name: Docker build & push

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Image to build and push'
        type: choice
        required: true
        default: all
        options:
          - all
          - backend
          - frontend
          - mydb_frontend

env:
  IMAGE_REPO: linea/target

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      matrix: ${{ steps.vars.outputs.matrix }}
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          # git describe needs the full history and tags
          fetch-depth: 0

      - name: Compute tag and image matrix
        id: vars
        env:
          SELECTION: ${{ inputs.image }}
        run: |
          images='[
            {"name": "backend", "file": "compose/production/django/Dockerfile"},
            {"name": "frontend", "file": "compose/production/frontend/Dockerfile"},
            {"name": "mydb_frontend", "file": "mydb/compose/production/frontend/Dockerfile"}
          ]'
          matrix=$(jq -c --arg sel "$SELECTION" '[.[] | select($sel == "all" or .name == $sel)]' <<< "$images")
          echo "tag=$(git describe --always)" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-push:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    name: build-push (${{ matrix.name }})
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ env.IMAGE_REPO }}:${{ matrix.name }}_${{ needs.setup.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Record result
        if: always()
        env:
          NAME: ${{ matrix.name }}
          IMAGE: ${{ env.IMAGE_REPO }}:${{ matrix.name }}_${{ needs.setup.outputs.tag }}
          OUTCOME: ${{ steps.build.outcome }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p result
          jq -n --arg name "$NAME" --arg image "$IMAGE" --arg outcome "$OUTCOME" --arg digest "$DIGEST" \
            '{name: $name, image: $image, outcome: $outcome, digest: $digest}' > "result/${NAME}.json"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.name }}
          path: result/
          retention-days: 1

  summary:
    needs: [setup, build-push]
    if: always() && needs.setup.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download results
        uses: actions/download-artifact@v4
        with:
          pattern: result-*
          merge-multiple: true
          path: results
        continue-on-error: true

      - name: Write summary
        env:
          SELECTION: ${{ inputs.image }}
          TAG: ${{ needs.setup.outputs.tag }}
          MATRIX: ${{ needs.setup.outputs.matrix }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          pushed=()
          rows=""
          for name in $(jq -r '.[].name' <<< "$MATRIX"); do
            image="${IMAGE_REPO}:${name}_${TAG}"
            file="results/${name}.json"
            outcome=$([ -f "$file" ] && jq -r '.outcome' "$file" || echo "unknown")
            digest=$([ -f "$file" ] && jq -r '.digest' "$file" || echo "")
            case "$outcome" in
              success) icon="✅ pushed"; pushed+=("$image") ;;
              failure) icon="❌ failed" ;;
              *) icon="⚠️ ${outcome}" ;;
            esac
            rows+="| ${name} | **\`${image}\`** | ${icon} | \`${digest:--}\` |"$'\n'
          done

          {
            echo "## 🐳 Docker images pushed"
            echo
            echo "**Selection:** \`${SELECTION}\` · **Branch:** \`${REF_NAME}\` · **Commit:** \`${SHA:0:7}\` · **Tag suffix:** \`${TAG}\`"
            echo
            echo "| Image | Name | Status | Digest |"
            echo "|---|---|---|---|"
            printf '%s' "$rows"
            if [ ${#pushed[@]} -gt 0 ]; then
              echo
              echo "### Pushed images"
              echo
              echo '```text'
              printf '%s\n' "${pushed[@]}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
