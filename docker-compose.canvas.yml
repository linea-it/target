services:
  backend: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    depends_on:
      - postgres-14
    volumes:
      - ..:/workspaces
      - ./backend/:/app:z
      - ./logs/:/logs
      - ./data/tmp:/data
    env_file:
      - .env
    environment:
      - APPLICATION_NAME=CAnVAS
      - APPLICATION_TITLE=CAnVAS
      - ENABLE_CLUSTER=True
    command: /start
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres-14:
    build:
      context: .
      dockerfile: ./compose/local/postgresql_14/Dockerfile
    ports:
      - "5432:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data
      - ./pg_data:/backups
    environment:
      - POSTGRES_PORT=5432
      - POSTGRES_DB=target
      - POSTGRES_USER=debug
      - POSTGRES_PASSWORD=debug
    # environment:
    #   - POSTGRES_PORT=5432
    #   - POSTGRES_DB=canvas_admin
    #   - POSTGRES_USER=postgres
    #   - POSTGRES_PASSWORD=postgres

  postgres-18:
    build:
      context: .
      dockerfile: ./compose/local/postgresql_18/Dockerfile
    ports:
      - "5433:5432"
    volumes:
      - ./pg_data_18:/var/lib/postgresql
    environment:
      - POSTGRES_PORT=5432
      - POSTGRES_DB=canvas_catalogs
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres


  # -------------- FOR FUTURE USE --------------
  # mailpit:
  #   image: docker.io/axllent/mailpit:latest
  #   container_name: target_local_mailpit
  #   ports:
  #     - "8025:8025"

  redis:
    image: docker.io/redis:6
    volumes:
      - target_local_redis_data:/data

  celeryworker:
    <<: *django
    depends_on:
      - redis
      - postgres-14
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    depends_on:
      - redis
      - postgres-14
    ports: []
    command: /start-celerybeat

  flower:
    <<: *django
    ports:
      - '5555:5555'
    depends_on:
      - redis
    command: /start-flower

  frontend:
    image: node:22.12.0-bookworm-slim
    user: 1000:1000
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "yarn && yarn dev"

  # Servidor Web NGINX
  nginx:
    image: nginx:latest
    ports:
      - 80:80
    volumes:
      # Arquivo de configuração do Ngnix para este ambiente.
      - ./compose/local/nginx/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      # Diretório onde o backend manipula arquivos, e que deve ficar acessivel ao servidor web.
      - ./data/tmp:/var/www/data
    depends_on:
      - backend
      - frontend

volumes:
  target_local_redis_data:
